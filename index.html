<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>RDO Digital — Modular Service</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0F172A; padding: 1rem; }
    .login-card { width: 100%; max-width: 380px; }
    .logo-box { width: 64px; height: 64px; background: #F97316; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 8px 24px rgba(249,115,22,.4); }
    .logo-box span { color: #fff; font-size: 2rem; font-weight: 900; }
    .card-body { background: #fff; border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .error-box { background: #FEE2E2; border: 1px solid #FECACA; color: #991B1B; border-radius: .5rem; padding: .75rem 1rem; font-size: .875rem; margin-bottom: 1rem; display: none; }
    h1 { color: #fff; text-align: center; font-size: 1.3rem; margin-bottom: .2rem; }
    .subtitle { color: #64748B; text-align: center; font-size: .85rem; margin-bottom: 1.5rem; }
    .hint { text-align: center; font-size: .75rem; color: #94A3B8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-box"><span>M</span></div>
    <h1>Modular Service</h1>
    <p class="subtitle">RDO Digital</p>

    <div class="card-body">
      <div class="error-box" id="err"></div>

      <form id="form">
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-login">Entrar</button>
      </form>
      <p class="hint">Login padrão: admin@modular.com / admin123</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const _loginBtn = document.getElementById('btn-login');
    _loginBtn.disabled = true;
    _loginBtn.textContent = 'Conectando…';

    DB.init().then(() => {
      _loginBtn.disabled = false;
      _loginBtn.textContent = 'Entrar';
      const u = Auth.getCurrentUser();
      if (u) location.href = u.perfil === 'ADMIN' ? 'admin/dashboard.html' : 'campo/home.html';

      document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true; btn.textContent = 'Entrando…';
        const r = Auth.login(document.getElementById('email').value, document.getElementById('senha').value);
        if (r.ok) {
          location.href = r.user.perfil === 'ADMIN' ? 'admin/dashboard.html' : 'campo/home.html';
        } else {
          const err = document.getElementById('err');
          err.textContent = r.msg; err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Entrar';
        }
      });
    });
  </script>
</body>
</html>
