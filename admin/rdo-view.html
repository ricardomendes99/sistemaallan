<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar RDO — RDO Digital</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .header { background: #0F172A; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: .75rem; }
    .logo-m { width: 36px; height: 36px; background: #F97316; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 900; color: #fff; }
    .logo-text h1 { font-size: 1rem; font-weight: 700; }
    .logo-text p  { font-size: .75rem; color: #64748B; }
    nav { background: #1E293B; padding: 0 1.5rem; }
    nav a { color: #94A3B8; padding: .625rem 1rem; font-size: .875rem; font-weight: 500; text-decoration: none; display: inline-block; }
    nav a:hover { color: #fff; }
    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
    .user-info { color: #94A3B8; font-size: .875rem; display: flex; align-items: center; gap: 1rem; }
    .btn-logout { background: none; border: none; color: #64748B; cursor: pointer; font-size: .875rem; padding: .25rem .5rem; border-radius: .375rem; }
    .btn-logout:hover { color: #fff; background: #334155; }
    .info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; margin-bottom: 1.25rem; }
    @media(min-width:640px){ .info-grid { grid-template-columns: repeat(3,1fr); } }
    .info-box { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: .5rem; padding: .75rem 1rem; }
    .info-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; color: #64748B; letter-spacing: .05em; }
    .info-value { font-size: .95rem; font-weight: 600; color: #1E293B; margin-top: .2rem; }
    .hora-view  { display: flex; gap: 1rem; padding: .75rem 1rem; border-bottom: 1px solid #F1F5F9; align-items: flex-start; }
    .hora-view:last-child { border-bottom: none; }
    .hora-view .ht { font-size: .95rem; font-weight: 700; color: #1E293B; min-width: 50px; }
    .hora-view .hd { flex: 1; font-size: .875rem; color: #334155; line-height: 1.5; }
    .status-pill { padding: .25rem .75rem; border-radius: 9999px; font-size: .75rem; font-weight: 700; flex-shrink: 0; }
    .s-ini { background:#DBEAFE; color:#1E40AF; }
    .s-and { background:#FEF3C7; color:#92400E; }
    .s-con { background:#DCFCE7; color:#166534; }
    .section-label { background: #1E293B; color: #fff; padding: .6rem 1rem; font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: .5rem .5rem 0 0; }
    .section-body  { border: 1px solid #E2E8F0; border-top: none; border-radius: 0 0 .5rem .5rem; min-height: 70px; padding: 1rem; font-size: .9rem; color: #334155; white-space: pre-wrap; }

    /* Client link box */
    .link-box { display: flex; align-items: center; gap: .5rem; background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: .5rem; padding: .5rem .75rem; }
    .link-box input { flex: 1; border: none; background: transparent; font-size: .78rem; color: #334155; font-family: monospace; }
    .link-box input:focus { outline: none; }

    /* Client approval status */
    .aprov-aprovado   { background:#DCFCE7; color:#166534; padding:.35rem .85rem; border-radius:9999px; font-size:.8rem; font-weight:700; display:inline-block; }
    .aprov-ressalvas  { background:#FEF3C7; color:#92400E; padding:.35rem .85rem; border-radius:9999px; font-size:.8rem; font-weight:700; display:inline-block; }
    .aprov-pendente   { background:#F1F5F9; color:#64748B; padding:.35rem .85rem; border-radius:9999px; font-size:.8rem; font-weight:700; display:inline-block; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-m">M</div>
      <div class="logo-text"><h1>Modular Service</h1><p>RDO Digital</p></div>
    </div>
    <div class="user-info">
      <span id="user-name"></span>
      <button class="btn-logout" onclick="Auth.logout()">Sair</button>
    </div>
  </header>
  <nav>
    <a href="dashboard.html">← Dashboard</a>
    <a href="historico.html">Histórico</a>
  </nav>

  <main id="main-content">
    <div style="text-align:center;padding:3rem;color:#94A3B8">Carregando…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../assets/js/pdf-gen.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rdoId  = params.get('id');

    DB.init().then(() => {
      const me = Auth.requireAuth('ADMIN');
      if (me) {
        document.getElementById('user-name').textContent = me.nome_completo;
        load();
      }
    });

    function statusClass(s) {
      return s === 'Iniciada' ? 's-ini' : s === 'Em Andamento' ? 's-and' : 's-con';
    }

    function aprovBadge(a) {
      if (!a) return '<span class="aprov-pendente">Aguardando aprovação do cliente</span>';
      return a === 'Aprovado'
        ? '<span class="aprov-aprovado">✅ Aprovado</span>'
        : '<span class="aprov-ressalvas">⚠️ Aprovado com ressalvas</span>';
    }

    function load() {
      if (!rdoId) { document.getElementById('main-content').innerHTML = '<p style="padding:2rem;color:#EF4444">RDO não encontrado.</p>'; return; }
      const rdo    = DB.getRDOById(rdoId);
      if (!rdo)    { document.getElementById('main-content').innerHTML = '<p style="padding:2rem;color:#EF4444">RDO não encontrado.</p>'; return; }
      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      const ef     = rdo.efetivo || {};

      document.title = `RDO ${Utils.formatDate(rdo.data_apontamento)} — ${obra.nome_obra || ''}`;

      const efRows = [
        ['Montador', ef.montador||0], ['Auxiliar Montagem', ef.auxiliar||0],
        ['Eletricista', ef.eletricista||0], ['Soldador', ef.soldador||0],
        ['Encarregado', ef.encarregado||0], ['Técnico Segurança', ef.tecnico_seguranca||0],
      ];
      const total = efRows.reduce((s,[,v]) => s+(+v||0), 0);

      // Client link
      const clienteLink = rdo.cliente_token
        ? `${location.origin}${location.pathname.replace(/\/admin\/.*$/, '')}/cliente/ver.html?rdo=${rdoId}&t=${rdo.cliente_token}`
        : null;

      const html = `
        <!-- Title row -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1.25rem">
          <div>
            <p style="font-size:1.15rem;font-weight:700;color:#1E293B">${obra.nome_obra || 'Obra não encontrada'}</p>
            <p style="font-size:.85rem;color:#64748B">${Utils.getDayOfWeek(rdo.data_apontamento)}, ${Utils.formatDate(rdo.data_apontamento)} · OF: ${obra.codigo_of||'—'}</p>
          </div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
            ${Utils.statusBadge(rdo.status_documento)}
            <button class="btn btn-ghost btn-sm" onclick="window.open('rdo-print.html?id=${rdoId}','_blank')">🖨 Imprimir / PDF</button>
            <button class="btn btn-primary btn-sm" onclick="downloadPDF()">⬇ Baixar PDF</button>
          </div>
        </div>

        <!-- Aprovação do cliente -->
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
            <span>Aprovação do Cliente</span>
            ${aprovBadge(rdo.aprovacao_cliente)}
          </div>
          <div style="padding:1rem 1.25rem">
            ${rdo.aprovacao_cliente ? `
              <p style="font-size:.875rem;color:#334155"><strong>Aprovado por:</strong> ${rdo.nome_aprovador_cliente || '—'}</p>
              ${rdo.comentario_cliente ? `<div style="margin-top:.75rem;background:#FFFBEB;border:1px solid #FCD34D;border-radius:.5rem;padding:.75rem 1rem;font-size:.875rem;color:#78350F">"${rdo.comentario_cliente}"</div>` : ''}
            ` : `
              <p style="font-size:.875rem;color:#64748B;margin-bottom:.85rem">Gere um link para o cliente revisar e aprovar o relatório:</p>
              ${clienteLink ? `
                <div class="link-box" style="margin-bottom:.75rem">
                  <input type="text" readonly id="link-input" value="${clienteLink}">
                  <button class="btn btn-ghost btn-sm" onclick="copyLink()">Copiar</button>
                </div>
                <p style="font-size:.75rem;color:#94A3B8">Envie este link por WhatsApp ou e-mail para o cliente.</p>
              ` : `
                <button class="btn btn-primary btn-sm" onclick="gerarLink()">🔗 Gerar Link para Cliente</button>
              `}
            `}
          </div>
        </div>

        <!-- Info grid -->
        <div class="info-grid">
          <div class="info-box"><p class="info-label">Cliente</p><p class="info-value">${obra.cliente_nome||'—'}</p></div>
          <div class="info-box"><p class="info-label">Local</p><p class="info-value">${obra.endereco_local||'—'}</p></div>
          <div class="info-box"><p class="info-label">Contato</p><p class="info-value">${obra.cliente_contato||'—'}</p></div>
          <div class="info-box"><p class="info-label">Criador</p><p class="info-value">${cri.nome_completo||'—'}</p></div>
          <div class="info-box"><p class="info-label">Início</p><p class="info-value">${rdo.horario_inicio||'—'}</p></div>
          <div class="info-box"><p class="info-label">Término</p><p class="info-value">${rdo.horario_termino||'—'}</p></div>
          <div class="info-box"><p class="info-label">Tempo Manhã</p><p class="info-value">${rdo.condicao_tempo_manha||'—'}</p></div>
          <div class="info-box"><p class="info-label">Tempo Tarde</p><p class="info-value">${rdo.condicao_tempo_tarde||'—'}</p></div>
          <div class="info-box"><p class="info-label">Atividade</p><p class="info-value">${rdo.atividade||'—'}</p></div>
        </div>

        <!-- Efetivo -->
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header">Efetivo da Equipe</div>
          <div style="display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem">
            ${efRows.map(([r,v]) => `<div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:.5rem;padding:.5rem .85rem;font-size:.875rem"><strong>${v}</strong> ${r}</div>`).join('')}
            <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:.5rem;padding:.5rem .85rem;font-size:.875rem"><strong>${total}</strong> Total</div>
          </div>
        </div>

        <!-- Hora a hora -->
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header">Apontamento Hora a Hora</div>
          ${Utils.getSlotsInRange(rdo.horario_inicio, rdo.horario_termino).map(slot => {
            const l = linhas.find(x => x.horario_ponto === slot);
            const isLunch = slot === Utils.floorHour(rdo.horario_almoco);
            if (isLunch) return `<div class="hora-view" style="background:#FFFBEB"><span class="ht" style="color:#D97706">${slot}</span><span class="hd" style="color:#92400E;font-style:italic">Intervalo de almoço</span></div>`;
            if (!l) return `<div class="hora-view" style="opacity:.35"><span class="ht">${slot}</span><span class="hd">—</span></div>`;
            return `<div class="hora-view">
              <span class="ht">${slot}</span>
              <div class="hd">
                ${l.referencia_modulo ? `<span style="font-size:.72rem;font-weight:600;color:#94A3B8">${l.referencia_modulo}</span><br>` : ''}
                ${l.descricao_detalhada || '—'}
              </div>
              ${l.status_atividade ? `<span class="status-pill ${statusClass(l.status_atividade)}">${l.status_atividade}</span>` : ''}
            </div>`;
          }).join('')}
        </div>

        <!-- Observações e Desvios -->
        <div style="margin-bottom:1.25rem">
          <div class="section-label">Campo Observações e Desvios</div>
          <div class="section-body">${rdo.observacoes_desvios || '<span style="color:#94A3B8">Sem observações.</span>'}</div>
        </div>

        <!-- Assinatura do cliente -->
        ${rdo.assinatura_cliente_base64 ? `
        <div class="card" style="margin-bottom:1.25rem;padding:1rem">
          <p style="font-size:.75rem;font-weight:700;text-transform:uppercase;color:#64748B;margin-bottom:.5rem">Assinatura do Cliente</p>
          <img src="${rdo.assinatura_cliente_base64}" style="max-height:100px;border:1px solid #E2E8F0;border-radius:.5rem">
          <p style="font-size:.875rem;color:#334155;margin-top:.4rem"><strong>${rdo.assinatura_nome_confirmacao || ''}</strong></p>
        </div>` : ''}

        <!-- Fotos -->
        ${rdo.fotos && rdo.fotos.length > 0 ? `
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header">Fotos da Obra (${rdo.fotos.length})</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem;padding:1rem">
            ${rdo.fotos.map((src, i) => `
              <div style="aspect-ratio:1;border-radius:.5rem;overflow:hidden;border:1px solid #E2E8F0;cursor:zoom-in" onclick="verFotoAdmin('${i}')">
                <img src="${src}" alt="Foto ${i+1}" style="width:100%;height:100%;object-fit:cover;display:block">
              </div>`).join('')}
          </div>
        </div>` : ''}

        <!-- Comentários Fiscalização (Admin) -->
        <div style="margin-bottom:1.25rem">
          <div class="section-label">Comentários de Fiscalização (Admin)</div>
          <div class="section-body" style="padding:0">
            <textarea id="coment-field"
              style="width:100%;min-height:100px;padding:1rem;border:none;resize:vertical;font-family:inherit;font-size:.9rem;border-radius:0 0 .5rem .5rem"
              placeholder="Escreva os comentários de fiscalização aqui…"
            >${rdo.comentarios_fiscalizacao || ''}</textarea>
          </div>
          <div style="text-align:right;margin-top:.5rem">
            <button class="btn btn-primary btn-sm" onclick="saveComent()">Salvar Comentário</button>
          </div>
        </div>
      `;

      document.getElementById('main-content').innerHTML = html;
    }

    function verFotoAdmin(idx) {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !rdo.fotos) return;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out';
      overlay.innerHTML = `<img src="${rdo.fotos[idx]}" style="max-width:100%;max-height:100%;border-radius:.5rem;object-fit:contain">`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    }

    function gerarLink() {
      const token = DB.generateClienteToken();
      DB.updateRDO(rdoId, { cliente_token: token });
      Utils.toast('Link gerado! Recarregando…');
      setTimeout(() => load(), 600);
    }

    function copyLink() {
      const el = document.getElementById('link-input');
      el.select();
      navigator.clipboard.writeText(el.value).then(() => Utils.toast('Link copiado!')).catch(() => {
        document.execCommand('copy'); Utils.toast('Link copiado!');
      });
    }

    function saveComent() {
      const txt = document.getElementById('coment-field').value;
      DB.updateRDO(rdoId, { comentarios_fiscalizacao: txt });
      Utils.toast('Comentário salvo!');
    }

    function downloadPDF() {
      const rdo    = DB.getRDOById(rdoId);
      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      PDFGen.generate(rdo, obra, cri, linhas);
    }
  </script>
</body>
</html>
