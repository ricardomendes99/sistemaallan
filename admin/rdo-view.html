  <style>
    .info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 1rem; margin-bottom: 1.25rem; }
    @media(min-width:640px){ .info-grid { grid-template-columns: repeat(3,1fr); } }
    .info-box { background:var(--c-surface-2); border: 1px solid #E2E8F0; border-radius: .5rem; padding: .75rem 1rem; }
    .info-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; color:var(--c-text-3); letter-spacing: .05em; }
    .info-value { font-size: .95rem; font-weight: 600; color:var(--c-text); margin-top: .2rem; }
    .hora-view  { display: flex; gap: 1rem; padding: .75rem 1rem; border-bottom: 1px solid #F1F5F9; align-items: flex-start; }
    .hora-view:last-child { border-bottom: none; }
    .hora-view .ht { font-size: .95rem; font-weight: 700; color:var(--c-text); min-width: 50px; }
    .hora-view .hd { flex: 1; font-size: .875rem; color:var(--c-text-2); line-height: 1.5; }
    .status-pill { padding: .25rem .75rem; border-radius: 9999px; font-size: .75rem; font-weight: 700; flex-shrink: 0; }
    .s-ini { background:#DBEAFE; color:#1E40AF; }
    .s-and { background:#FEF3C7; color:#92400E; }
    .s-con { background:#DCFCE7; color:#166534; }
    .section-label { background: #1E293B; color: #fff; padding: .6rem 1rem; font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: .5rem .5rem 0 0; }
    .section-body  { border: 1px solid #E2E8F0; border-top: none; border-radius: 0 0 .5rem .5rem; min-height: 70px; padding: 1rem; font-size: .9rem; color:var(--c-text-2); white-space: pre-wrap; }
    .link-box { display: flex; align-items: center; gap: .5rem; background:var(--c-surface-2); border: 1.5px solid #E2E8F0; border-radius: .5rem; padding: .5rem .75rem; }
    .link-box input { flex: 1; border: none; background: transparent; font-size: .78rem; color:var(--c-text-2); font-family: monospace; }
    .link-box input:focus-visible { outline: 2px solid #F97316; outline-offset: 2px; border-radius: .25rem; }
    .aprov-aprovado   { background:#DCFCE7; color:#166534; padding:.35rem .85rem; border-radius:9999px; font-size:.8rem; font-weight:700; display:inline-block; }
    .aprov-ressalvas  { background:#FEF3C7; color:#92400E; padding:.35rem .85rem; border-radius:9999px; font-size:.8rem; font-weight:700; display:inline-block; }
    .aprov-pendente   { background:var(--c-surface-2); color:var(--c-text-3); padding:.35rem .85rem; border-radius:9999px; font-size:.8rem; font-weight:700; display:inline-block; }
  </style>
</head>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../assets/js/pdf-gen.js"></script>
  <script src="../assets/js/assinafy.js?v=5"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rdoId  = params.get('id');

    DB.init().then(() => {
      const me = Auth.requireAuth('ADMIN');
      if (me) {
        document.getElementById('user-name').textContent = me.nome_completo;
        load();
      }
    });

    function statusClass(s) {
      return s === 'Iniciada' ? 's-ini' : s === 'Em Andamento' ? 's-and' : 's-con';
    }

    function aprovBadge(a) {
      if (!a) return '<span class="aprov-pendente">Aguardando aprovação do cliente</span>';
      return a === 'Aprovado'
        ? '<span class="aprov-aprovado">Aprovado</span>'
        : '<span class="aprov-ressalvas">Aprovado com ressalvas</span>';
    }

    function renderAssinaturaCard(rdo, obra) {
      const sigs = obra.emails_signatarios || [];
      const status = rdo.assinafy_status || 'nao_enviado';
      const bloqueioEnvio = sigs.length === 0
        ? 'Cadastre signatários na obra primeiro'
        : !rdo.assinatura_cliente_base64
          ? 'O Responsável pela Obra ainda não assinou no campo'
          : (!rdo.assinatura_modular_nome ? 'O Responsável Modular (gerente) precisa validar e assinar antes de enviar ao cliente' : '');

      const statusBadge = {
        nao_enviado: '<span style="background:var(--c-surface-2);color:var(--c-text-3);padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700">Não enviado</span>',
        enviado:     '<span style="background:#DBEAFE;color:#1E40AF;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700">✉ Aguardando assinatura</span>',
        assinado:    '<span style="background:#DCFCE7;color:#166534;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700">✅ Assinado</span>',
        rejeitado:   '<span style="background:#FEE2E2;color:#991B1B;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700">Rejeitado</span>',
      }[status] || '';

      const sigList = sigs.length === 0
        ? '<p style="font-size:.825rem;color:var(--c-muted);margin:.5rem 0">Nenhum signatário ainda — adicione o e-mail do cliente abaixo.</p>'
        : sigs.map((s, i) => `<div style="display:flex;align-items:center;gap:.5rem;font-size:.825rem;color:var(--c-text-2);margin:.25rem 0">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span style="flex:1"><strong>${s.nome || '—'}</strong> — ${s.email}</span>
            ${status === 'nao_enviado' ? `<button type="button" aria-label="Remover signatário ${s.email}" title="Remover" onclick="removeSignatarioRDO(${i})" style="background:none;border:none;cursor:pointer;color:#EF4444;font-size:1.05rem;line-height:1">×</button>` : ''}
          </div>`).join('');

      const addForm = status === 'nao_enviado' ? `
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem">
          <input type="text" id="sig-add-nome" placeholder="Nome (opcional)" autocomplete="off" style="flex:1;min-width:120px;padding:.4rem .6rem;border:1px solid var(--c-border);border-radius:.4rem;font-size:.8rem;background:var(--c-surface);color:var(--c-text)">
          <input type="email" id="sig-add-email" placeholder="email@cliente.com *" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter'){event.preventDefault();addSignatarioRDO();}" style="flex:1.4;min-width:160px;padding:.4rem .6rem;border:1px solid var(--c-border);border-radius:.4rem;font-size:.8rem;background:var(--c-surface);color:var(--c-text)">
          <button type="button" class="btn btn-primary btn-sm" onclick="addSignatarioRDO()">+ Adicionar signatário</button>
        </div>` : '';

      const actionArea = status === 'nao_enviado'
        ? `<button class="btn btn-primary btn-sm" id="btn-assinar" onclick="enviarAssinatura()" ${bloqueioEnvio ? `disabled title="${bloqueioEnvio}"` : ''}>
             Enviar para Assinatura Digital
           </button>${bloqueioEnvio ? `<p style="font-size:.75rem;color:#92400E;margin-top:.5rem">⚠ ${bloqueioEnvio}.</p>` : ''}`
        : status === 'enviado'
        ? `<div style="display:flex;gap:.5rem;flex-wrap:wrap">
             <button class="btn btn-ghost btn-sm" onclick="verificarStatusAssinafy()">Verificar Status</button>
             <button class="btn btn-ghost btn-sm" onclick="reenviarAssinatura()">Reenviar</button>
           </div>`
        : status === 'assinado'
        ? `<div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:center">
             <button class="btn btn-ghost btn-sm" onclick="visualizarDocumentoAssinado()">Visualizar</button>
             <button class="btn btn-primary btn-sm" onclick="baixarDocumentoAssinado()">Baixar RDO Assinado</button>
             <span style="font-size:.825rem;color:#166534">Assinado em ${rdo.assinafy_signed_at ? new Date(rdo.assinafy_signed_at).toLocaleString('pt-BR') : '—'}</span>
           </div>`
        : status === 'rejeitado'
        ? `<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
             <button class="btn btn-primary btn-sm" onclick="reenviarAssinatura()">Reenviar para Assinatura</button>
             <span style="font-size:.75rem;color:#991B1B">O cliente recusou — corrija e reenvie.</span>
           </div>`
        : '';

      const enviadoInfo = (status !== 'nao_enviado' && rdo.assinafy_sent_at)
        ? `<p style="font-size:.75rem;color:var(--c-text-3);margin-top:.5rem">Enviado em ${new Date(rdo.assinafy_sent_at).toLocaleString('pt-BR')}</p>` : '';

      return `
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
            <span>Assinatura Digital</span>
            ${statusBadge}
          </div>
          <div style="padding:1rem 1.25rem">
            <p style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--c-text-3);margin-bottom:.4rem">Signatários (e-mails do cliente p/ assinatura)</p>
            ${sigList}
            ${addForm}
            ${enviadoInfo}
            <div style="margin-top:.85rem">${actionArea}</div>
          </div>
        </div>`;
    }

    // Cadastro de signatário (e-mail do cliente) direto na tela do RDO — salva na obra
    function addSignatarioRDO() {
      const nome  = (document.getElementById('sig-add-nome')?.value || '').trim();
      const email = (document.getElementById('sig-add-email')?.value || '').trim().toLowerCase();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Toast.error('Informe um e-mail válido.'); const el = document.getElementById('sig-add-email'); if (el) el.focus(); return; }
      const rdo = DB.getRDOById(rdoId); const obra = rdo && DB.getObraById(rdo.id_obra);
      if (!obra) { Toast.error('Obra não encontrada.'); return; }
      const lista = [...(obra.emails_signatarios || [])];
      if (lista.find(s => s.email === email)) { Toast.warning('Este e-mail já está na lista.'); return; }
      lista.push({ nome: nome || email.split('@')[0], email });
      DB.updateObra(obra.id_obra, { emails_signatarios: lista });
      Toast.success('Signatário adicionado!');
      setTimeout(() => load(), 400);
    }
    function removeSignatarioRDO(idx) {
      const rdo = DB.getRDOById(rdoId); const obra = rdo && DB.getObraById(rdo.id_obra);
      if (!obra) return;
      const lista = [...(obra.emails_signatarios || [])];
      lista.splice(idx, 1);
      DB.updateObra(obra.id_obra, { emails_signatarios: lista });
      Toast.warning('Signatário removido.');
      setTimeout(() => load(), 400);
    }

    // ── Assinatura do Responsável Modular (gerente) — validada e assinada no admin ──
    let _padGerente = null;
    function createPad(canvasId, statusId) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return null;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width  = rect.width  * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      let drawing = false, empty = true, lastX = 0, lastY = 0;
      const pos = e => { const r = canvas.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: s.clientX - r.left, y: s.clientY - r.top }; };
      function start(e) { e.preventDefault(); drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; ctx.beginPath(); ctx.moveTo(lastX, lastY); }
      function move(e) {
        e.preventDefault(); if (!drawing) return;
        const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); lastX = p.x; lastY = p.y;
        if (!empty) return; empty = false; canvas.classList.add('has-sig');
        const st = document.getElementById(statusId); if (st) { st.textContent = 'Assinatura capturada ✓'; st.style.color = '#16A34A'; }
      }
      function stop(e) { e.preventDefault(); drawing = false; ctx.beginPath(); }
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', stop, { passive: false });
      return {
        isEmpty: () => empty,
        dataURL: () => canvas.toDataURL('image/png'),
        clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.classList.remove('has-sig'); empty = true; const st = document.getElementById(statusId); if (st) { st.textContent = 'Aguardando assinatura…'; st.style.color = ''; } }
      };
    }
    function initGerentePad() { _padGerente = createPad('sig-canvas-gerente', 'sig-status-gerente'); }
    function clearGerente() { if (_padGerente) _padGerente.clear(); }
    function saveGerente() {
      const nome = (document.getElementById('f-nome-gerente')?.value || '').trim();
      if (!nome) { Toast.error('Informe o nome do Responsável Modular (gerente).'); const el = document.getElementById('f-nome-gerente'); if (el) el.focus(); return; }
      const atual = DB.getRDOById(rdoId) || {};
      let base64 = atual.assinatura_modular_base64 || null;      // mantém a atual por padrão
      if (_padGerente && !_padGerente.isEmpty()) base64 = _padGerente.dataURL();  // assinou de novo → substitui
      DB.updateRDO(rdoId, { assinatura_modular_nome: nome, assinatura_modular_base64: base64 });
      Toast.success('Assinatura do gerente salva!');
      setTimeout(() => load(), 400);
    }
    function renderGerenteCard(rdo) {
      const assinado = !!rdo.assinatura_modular_nome;
      const badge = assinado
        ? '<span style="background:#DCFCE7;color:#166534;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700">Validado / Assinado</span>'
        : '<span style="background:#FEF3C7;color:#92400E;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:700">Pendente de validação</span>';
      return `
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header" style="display:flex;align-items:center;justify-content:space-between">
            <span>Validação e Assinatura — Responsável Modular (Gerente)</span>
            ${badge}
          </div>
          <div style="padding:1rem 1.25rem">
            ${assinado && rdo.assinatura_modular_base64 ? `<div style="margin-bottom:.75rem"><p style="font-size:.7rem;text-transform:uppercase;color:var(--c-text-3);font-weight:700;margin-bottom:.25rem">Assinatura atual</p><img src="${rdo.assinatura_modular_base64}" style="max-height:70px;background:#ffffff;border:1px solid #E2E8F0;border-radius:.5rem"></div>` : ''}
            <div class="field" style="margin-bottom:.75rem">
              <label for="f-nome-gerente">Nome do Responsável Modular *</label>
              <input type="text" id="f-nome-gerente" name="nome_modular" autocomplete="name" placeholder="Nome completo do gerente / responsável Modular" value="${(rdo.assinatura_modular_nome || '').replace(/"/g, '&quot;')}">
            </div>
            <p style="font-size:.75rem;color:var(--c-muted);margin-bottom:.4rem">Assine abaixo (opcional — pode deixar só o nome). Para substituir, assine novamente.</p>
            <div class="sig-wrap">
              <canvas id="sig-canvas-gerente" role="img" aria-label="Área de assinatura do responsável Modular" style="display:block;width:100%;height:160px;touch-action:none;cursor:crosshair;border-radius:.5rem;border:2px dashed #CBD5E1;background:#ffffff;"></canvas>
            </div>
            <p id="sig-status-gerente" role="status" aria-live="polite" style="font-size:.75rem;text-align:center;margin-top:.4rem;color:var(--c-muted)">Aguardando assinatura…</p>
            <div style="display:flex;gap:.5rem;margin-top:.5rem">
              <button class="btn btn-ghost btn-sm" onclick="clearGerente()">Limpar</button>
              <button class="btn btn-primary btn-sm" style="flex:1" onclick="saveGerente()">Salvar assinatura do gerente</button>
            </div>
          </div>
        </div>`;
    }

    function load() {
      if (!rdoId) { document.getElementById('main-content').innerHTML = '<p style="padding:2rem;color:#EF4444">RDO não encontrado.</p>'; return; }
      const rdo    = DB.getRDOById(rdoId);
      if (!rdo)    { document.getElementById('main-content').innerHTML = '<p style="padding:2rem;color:#EF4444">RDO não encontrado.</p>'; return; }
      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      const ef     = rdo.efetivo || {};

      document.title = `RDO ${Utils.formatDate(rdo.data_apontamento)} — ${obra.nome_obra || ''}`;

      const efRows = [
        ['Montador', ef.montador||0], ['Auxiliar Montagem', ef.auxiliar||0],
        ['Eletricista', ef.eletricista||0], ['Soldador', ef.soldador||0],
        ['Encarregado', ef.encarregado||0], ['Técnico Segurança', ef.tecnico_seguranca||0],
      ];
      const total = efRows.reduce((s,[,v]) => s+(+v||0), 0);

      const clienteLink = rdo.cliente_token
        ? `${location.origin}${location.pathname.replace(/\/admin\/.*$/, '')}/cliente/ver.html?rdo=${rdoId}&t=${rdo.cliente_token}`
        : null;

      const html = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;margin-bottom:1.25rem">
          <div>
            <p style="font-size:1.15rem;font-weight:700;color:var(--c-text)">${obra.nome_obra || 'Obra não encontrada'}</p>
            <p style="font-size:.85rem;color:var(--c-text-3)">${Utils.getDayOfWeek(rdo.data_apontamento)}, ${Utils.formatDate(rdo.data_apontamento)} · OF: ${obra.codigo_of||'—'}</p>
          </div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
            ${Utils.statusBadge(rdo.status_documento)}
            <button class="btn btn-ghost btn-sm" onclick="window.open('rdo-print.html?id=${rdoId}','_blank')">Imprimir / PDF</button>
            <button class="btn btn-primary btn-sm" onclick="downloadPDF()">Baixar PDF</button>
          </div>
        </div>

        ${renderGerenteCard(rdo)}

        ${renderAssinaturaCard(rdo, obra)}

        <div class="info-grid">
          <div class="info-box"><p class="info-label">Cliente</p><p class="info-value">${obra.cliente_nome||'—'}</p></div>
          <div class="info-box"><p class="info-label">Local</p><p class="info-value">${obra.endereco_local||'—'}</p></div>
          <div class="info-box"><p class="info-label">Contato</p><p class="info-value">${obra.cliente_contato||'—'}</p></div>
          <div class="info-box"><p class="info-label">Criador</p><p class="info-value">${cri.nome_completo||'—'}</p></div>
          <div class="info-box"><p class="info-label">Início</p><p class="info-value">${rdo.horario_inicio||'—'}</p></div>
          <div class="info-box"><p class="info-label">Término</p><p class="info-value">${rdo.horario_termino||'—'}</p></div>
          <div class="info-box"><p class="info-label">Tempo Manhã</p><p class="info-value">${rdo.condicao_tempo_manha||'—'}</p></div>
          <div class="info-box"><p class="info-label">Tempo Tarde</p><p class="info-value">${rdo.condicao_tempo_tarde||'—'}</p></div>
          <div class="info-box"><p class="info-label">Atividade</p><p class="info-value">${rdo.atividade||'—'}</p></div>
        </div>

        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header">Efetivo da Equipe</div>
          <div style="display:flex;flex-wrap:wrap;gap:.5rem;padding:1rem">
            ${efRows.map(([r,v]) => `<div style="background:var(--c-surface-2);border:1px solid #E2E8F0;border-radius:.5rem;padding:.5rem .85rem;font-size:.875rem"><strong>${v}</strong> ${r}</div>`).join('')}
            <div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:.5rem;padding:.5rem .85rem;font-size:.875rem"><strong>${total}</strong> Total</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header">Apontamento Hora a Hora</div>
          ${Utils.getSlotsInRange(rdo.horario_inicio, rdo.horario_termino).map(slot => {
            const l = linhas.find(x => x.horario_ponto === slot);
            const isLunch = slot === Utils.floorHour(rdo.horario_almoco);
            if (isLunch) return `<div class="hora-view" style="background:#FFFBEB"><span class="ht" style="color:#D97706">${slot}</span><span class="hd" style="color:#92400E;font-style:italic">Intervalo de almoço</span></div>`;
            if (!l) return `<div class="hora-view" style="opacity:.35"><span class="ht">${slot}</span><span class="hd">—</span></div>`;
            return `<div class="hora-view">
              <span class="ht">${slot}</span>
              <div class="hd">
                ${l.referencia_modulo ? `<span style="font-size:.72rem;font-weight:600;color:var(--c-muted)">${l.referencia_modulo}</span><br>` : ''}
                ${l.descricao_detalhada || '—'}
              </div>
              ${l.status_atividade ? `<span class="status-pill ${statusClass(l.status_atividade)}">${l.status_atividade}</span>` : ''}
            </div>`;
          }).join('')}
        </div>

        <div style="margin-bottom:1.25rem">
          <div class="section-label">Campo Observações e Desvios</div>
          <div class="section-body">${rdo.observacoes_desvios || '<span style="color:var(--c-muted)">Sem observações.</span>'}</div>
        </div>

        ${rdo.assinatura_cliente_base64 ? `
        <div class="card" style="margin-bottom:1.25rem;padding:1rem">
          <p style="font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--c-text-3);margin-bottom:.5rem">Assinatura do Responsável pela Obra</p>
          <img src="${rdo.assinatura_cliente_base64}" style="max-height:100px;background:#ffffff;border:1px solid #E2E8F0;border-radius:.5rem">
          <p class="text-slate-800 dark:text-slate-100" style="font-size:.875rem;margin-top:.4rem"><strong>${rdo.assinatura_nome_confirmacao || ''}</strong></p>
        </div>` : ''}

        ${rdo.fotos && rdo.fotos.length > 0 ? `
        <div class="card" style="margin-bottom:1.25rem">
          <div class="card-header">Fotos da Obra (${rdo.fotos.length})</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.75rem;padding:1rem">
            ${rdo.fotos.map((src, i) => `
              <button type="button" aria-label="Ampliar foto ${i+1}" style="aspect-ratio:1;border-radius:.5rem;overflow:hidden;border:1px solid #E2E8F0;cursor:zoom-in;padding:0;background:none;display:block;width:100%" onclick="verFotoAdmin('${i}')">
                <img src="${src}" alt="Foto ${i+1}" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block">
              </button>`).join('')}
          </div>
        </div>` : ''}

        <div style="margin-bottom:1.25rem">
          <div class="section-label">Comentários de Fiscalização (Admin)</div>
          <div class="section-body" style="padding:0">
            <textarea id="coment-field" aria-label="Comentários de fiscalização"
              style="width:100%;min-height:100px;padding:1rem;border:none;resize:vertical;font-family:inherit;font-size:.9rem;border-radius:0 0 .5rem .5rem"
              placeholder="Escreva os comentários de fiscalização aqui…"
            >${rdo.comentarios_fiscalizacao || ''}</textarea>
          </div>
          <div style="text-align:right;margin-top:.5rem">
            <button class="btn btn-primary btn-sm" onclick="saveComent()">Salvar Comentário</button>
          </div>
        </div>
      `;

      document.getElementById('main-content').innerHTML = html;
      initGerentePad();

      // Inicia polling automático se aguardando assinatura
      if (rdo.assinafy_status === 'enviado' && rdo.assinafy_document_id) {
        _startPolling();
      } else {
        _stopPolling();
      }
    }

    function verFotoAdmin(idx) {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !rdo.fotos) return;
      const overlay = document.createElement('div');
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', `Foto ${+idx + 1} ampliada`);
      overlay.tabIndex = -1;
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out';
      overlay.innerHTML = `<img src="${rdo.fotos[idx]}" alt="Foto ${+idx + 1}" style="max-width:100%;max-height:100%;border-radius:.5rem;object-fit:contain">`;
      const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      overlay.onclick = close;
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      overlay.focus();
    }

    function gerarLink() {
      const token = DB.generateClienteToken();
      DB.updateRDO(rdoId, { cliente_token: token });
      Toast.success('Link gerado! Recarregando…');
      setTimeout(() => load(), 600);
    }

    function copyLink() {
      const el = document.getElementById('link-input');
      el.select();
      navigator.clipboard.writeText(el.value).then(() => Toast.success('Link copiado!')).catch(() => {
        document.execCommand('copy'); Toast.success('Link copiado!');
      });
    }

    function saveComent() {
      const txt = document.getElementById('coment-field').value;
      DB.updateRDO(rdoId, { comentarios_fiscalizacao: txt });
      Toast.success('Comentário salvo!');
    }

    function downloadPDF() {
      const rdo    = DB.getRDOById(rdoId);
      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      PDFGen.generate(rdo, obra, cri, linhas);
    }

    async function enviarAssinatura() {
      const rdo    = DB.getRDOById(rdoId);
      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      const sigs   = obra.emails_signatarios || [];

      if (sigs.length === 0) { Utils.toast('Cadastre signatários na obra primeiro.', 'warning'); return; }
      if (!rdo.assinatura_cliente_base64) { Utils.toast('O Responsável pela Obra ainda não assinou no campo.', 'warning'); return; }
      if (!rdo.assinatura_modular_nome) { Utils.toast('O Responsável Modular (gerente) precisa validar e assinar antes de enviar ao cliente.', 'warning'); return; }

      const btn = document.getElementById('btn-assinar');
      if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }

      try {
        const documentId = await Assinafy.enviarParaAssinatura(rdo, obra, cri, linhas, sigs);
        DB.updateRDO(rdoId, {
          assinafy_document_id: documentId,
          assinafy_status: 'enviado',
          assinafy_sent_at: new Date().toISOString(),
        });
        Utils.toast(`RDO enviado para ${sigs.length} signatário(s)!`, 'success');
        setTimeout(() => load(), 600);
      } catch (e) {
        console.error('[Assinafy]', e);
        Utils.toast('Erro ao enviar: ' + (e.message || 'Tente novamente.'), 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Enviar para Assinatura Digital'; }
      }
    }

    // Assinafy status map: API value → internal value
    function _mapAssinafyStatus(apiStatus) {
      if (apiStatus === 'certificated' || apiStatus === 'signed' || apiStatus === 'completed') return 'assinado';
      if (apiStatus === 'rejected' || apiStatus === 'declined') return 'rejeitado';
      return 'enviado';
    }

    async function verificarStatusAssinafy(silent = false) {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !rdo.assinafy_document_id) return;
      try {
        const doc = await Assinafy.getDocumentStatus(rdo.assinafy_document_id);
        const status = _mapAssinafyStatus(doc.status);
        if (status !== (rdo.assinafy_status || 'enviado')) {
          const update = { assinafy_status: status };
          if (status === 'assinado') update.assinafy_signed_at = new Date().toISOString();
          DB.updateRDO(rdoId, update);
          if (status === 'assinado') {
            Utils.toast('RDO assinado pelo cliente!', 'success');
            _stopPolling();
          }
          setTimeout(() => load(), 400);
        } else if (!silent) {
          Utils.toast('Ainda aguardando assinatura.', 'info');
        }
      } catch (e) {
        if (!silent) Utils.toast('Erro ao verificar status: ' + e.message, 'error');
      }
    }

    async function reenviarAssinatura() {
      DB.updateRDO(rdoId, { assinafy_status: 'nao_enviado', assinafy_document_id: null, assinafy_sent_at: null });
      setTimeout(() => { load(); setTimeout(() => enviarAssinatura(), 300); }, 300);
    }

    async function visualizarDocumentoAssinado() {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !rdo.assinafy_document_id) return;
      const btn = event.target;
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Carregando…';
      try {
        const blob = await Assinafy.downloadSignedDocument(rdo.assinafy_document_id);
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        // revoke after a delay to let the new tab load
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      } catch (e) {
        Toast.error('Erro ao visualizar documento: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function baixarDocumentoAssinado() {
      const rdo = DB.getRDOById(rdoId);
      const obra = DB.getObraById(rdo?.id_obra) || {};
      if (!rdo || !rdo.assinafy_document_id) return;
      const btn = event.target;
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Baixando…';
      try {
        const blob = await Assinafy.downloadSignedDocument(rdo.assinafy_document_id);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `RDO_Assinado_${obra.codigo_of || ''}_${rdo.data_apontamento || ''}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (e) {
        Toast.error('Erro ao baixar documento: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    // ── Polling automático ────────────────────────────
    let _pollTimer = null;
    function _startPolling() {
      if (_pollTimer) return;
      _pollTimer = setInterval(() => verificarStatusAssinafy(true), 30000); // a cada 30s
    }
    function _stopPolling() {
      if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
    }
  </script>
</body>
</html>
