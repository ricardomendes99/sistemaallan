      <img id="logo-full" src="../assets/img/logo-wordmark.png" alt="Modular" width="764" height="271" class="h-16 w-auto rounded-xl">
      <img id="logo-icon" src="../assets/img/M%20logo.png" alt="M" width="1178" height="1178" class="h-12 w-12 rounded-xl object-contain" style="display:none">
    </div>
    <nav class="flex-1 py-3 overflow-y-auto">
      <a href="dashboard.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="obras.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Obras</span>
      </a>
      <a href="usuarios.html" class="sidebar-nav-item active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Usuários</span>
      </a>
      <a href="historico.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="nav-label">Histórico RDOs</span>
      </a>
      <a href="relatorio-executivo.html" class="sidebar-nav-item">

        <span class="nav-label">Relatório Executivo</span>
      </a>

        <span class="nav-label">Backup</span>

    <div class="border-t border-slate-800 p-3">
      <div class="flex items-center gap-2.5 px-2">
        <div class="w-8 h-8 rounded-full bg-brand-500/20 flex items-center justify-center shrink-0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="nav-label flex-1 min-w-0">
          <p class="text-xs font-semibold text-white truncate" id="user-name">—</p>
          <p class="text-xs text-slate-500">Administrador</p>
        </div>
        <button onclick="Auth.logout()" title="Sair" aria-label="Sair"
                class="nav-label text-slate-500 hover:text-red-400 transition-colors p-1"
                style="background:none;border:none;cursor:pointer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Main wrap ── -->
  <div id="admin-wrap" class="admin-main">

    <header class="admin-topbar">
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle" class="text-slate-500 hover:text-slate-800 transition-colors" style="background:none;border:none;cursor:pointer" aria-label="Alternar menu lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <div>
          <h1 class="text-sm font-bold text-slate-900">Gestão de Usuários</h1>
          <p class="text-xs text-slate-500" id="count-label"></p>
        </div>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Novo Usuário</button>
    </header>

    <main id="conteudo" tabindex="-1" class="admin-content w-full">

      <div class="card overflow-x-auto">
        <div class="card-header flex items-center justify-between">
          <span>Usuários Cadastrados</span>
          <span id="count-badge" class="text-xs text-slate-400 font-normal"></span>
        </div>
        <table class="tbl">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Função</th>
              <th>Perfil</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title">Novo Usuário</span>
        <button onclick="closeModal()" aria-label="Fechar" style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--c-muted)">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div class="field">
          <label for="f-nome">Nome Completo *</label>
          <input type="text" id="f-nome" name="nome_completo" autocomplete="off" placeholder="João da Silva">
        </div>
        <div class="field">
          <label for="f-email">E-mail *</label>
          <input type="email" id="f-email" name="email" autocomplete="off" spellcheck="false" placeholder="joao@modular.com">
        </div>
        <div class="field">
          <label for="f-senha">Senha *</label>
          <input type="password" id="f-senha" name="senha" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
          <p class="hint">Deixe em branco ao editar para manter a senha atual.</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="field">
            <label for="f-perfil">Perfil</label>
            <select id="f-perfil" name="perfil">
              <option value="USUARIO">Usuário (Campo)</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </div>
          <div class="field">
            <label for="f-ativo">Status</label>
            <select id="f-ativo" name="ativo">
              <option value="1">Ativo</option>
              <option value="0">Inativo</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-funcao">Função Principal</label>
          <select id="f-funcao" name="funcao_principal">
            <option value="Montador">Montador</option>
            <option value="Auxiliar Montagem">Auxiliar Montagem</option>
            <option value="Eletricista">Eletricista</option>
            <option value="Soldador">Soldador</option>
            <option value="Encarregado">Encarregado</option>
            <option value="Técnico Segurança">Técnico Segurança</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="save()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    let me = null;
    DB.init().then(() => {
      me = Auth.requireAuth('ADMIN');
      if (me) {
        document.getElementById('user-name').textContent = me.nome_completo;
        render();
      }
    });

    function render() {
      const users = DB.getUsers();
      document.getElementById('count-label').textContent = `${users.length} usuário(s)`;
      document.getElementById('count-badge').textContent = `${users.length} usuário(s)`;
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td style="font-weight:600">${u.nome_completo}</td>
          <td style="color:var(--c-text-3);font-size:.875rem">${u.email}</td>
          <td style="font-size:.875rem">${u.funcao_principal || '—'}</td>
          <td><span class="perfil-badge ${u.perfil === 'ADMIN' ? 'perfil-admin' : 'perfil-user'}">${u.perfil}</span></td>
          <td><span class="${u.ativo ? 'status-ativo' : 'status-inativo'}">${u.ativo ? 'Ativo' : 'Inativo'}</span></td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="edit('${u.id}')">Editar</button>
            ${u.id !== me.id ? `<button class="btn btn-danger btn-sm" onclick="del('${u.id}')" style="margin-left:.4rem">Excluir</button>` : ''}
          </td>
        </tr>`).join('');
    }

    function openModal() {
      document.getElementById('edit-id').value = '';
      document.getElementById('modal-title').textContent = 'Novo Usuário';
      ['f-nome','f-email','f-senha'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-perfil').value = 'USUARIO';
      document.getElementById('f-funcao').value = 'Montador';
      document.getElementById('f-ativo').value  = '1';
      document.getElementById('modal').style.display = 'flex';
    }

    function edit(id) {
      const u = DB.getUserById(id);
      if (!u) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('modal-title').textContent = 'Editar Usuário';
      document.getElementById('f-nome').value   = u.nome_completo;
      document.getElementById('f-email').value  = u.email;
      document.getElementById('f-senha').value  = '';
      document.getElementById('f-perfil').value = u.perfil;
      document.getElementById('f-funcao').value = u.funcao_principal || 'Montador';
      document.getElementById('f-ativo').value  = u.ativo ? '1' : '0';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function save() {
      const nome  = document.getElementById('f-nome').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const senha = document.getElementById('f-senha').value;
      const id    = document.getElementById('edit-id').value;

      if (!nome || !email) { Toast.error('Preencha nome e e-mail.'); return; }
      if (!id && !senha)   { Toast.error('Informe a senha para o novo usuário.'); return; }
      if (senha && senha.length < 6) { Toast.error('Senha mínima: 6 caracteres.'); return; }

      const existing = DB.getUserByEmail(email);
      if (existing && existing.id !== id) { Toast.error('E-mail já cadastrado.'); return; }

      const data = {
        nome_completo: nome, email,
        perfil: document.getElementById('f-perfil').value,
        funcao_principal: document.getElementById('f-funcao').value,
        ativo: document.getElementById('f-ativo').value === '1'
      };
      if (senha) data.senha_hash = btoa(senha);

      if (id) DB.updateUser(id, data);
      else DB.createUser(data);

      closeModal(); render();
      Toast.success(id ? 'Usuário atualizado!' : 'Usuário criado!');
    }

    function del(id) {
      UIConfirm('Deseja excluir este usuário? Esta ação não pode ser desfeita.', () => {
        DB.deleteUser(id); render(); Toast.warning('Usuário excluído.');
      }, { danger: true, confirmText: 'Excluir' });
    }
  </script>
</body>
</html>
