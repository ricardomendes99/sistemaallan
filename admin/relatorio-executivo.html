<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="/faviconemodular/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/faviconemodular/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/faviconemodular/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/faviconemodular/apple-icon-180x180.png">
  <link rel="manifest" href="/faviconemodular/manifest.json">
  <meta name="msapplication-config" content="/faviconemodular/browserconfig.xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617">
  <title>Relatório Executivo — RDO Digital</title>
  <link rel="stylesheet" href="../assets/css/output.css">
  <style>
    @page { size: A4; margin: 12mm; }

    /* Report layout */
    .admin-content { max-width: none !important; }
    .report { padding: 0 0 2rem; width: 100%; }
    @media print {
      #sidebar, #admin-wrap > .admin-topbar { display: none !important; }
      #admin-wrap { margin-left: 0 !important; }
      .admin-content { padding: 0 !important; }
      .report { max-width: 100%; padding: 0; }
      .rep-box { border: none; border-radius: 0; box-shadow: none; }
      .rep-header { border-radius: 0; }
      .rep-footer { border-radius: 0; }
      .sec-title a { display: none; }
      body { background:var(--c-surface) !important; }
    }

    /* Report header */
    .rep-header { background: #0F172A; color: #fff; border-radius: .75rem .75rem 0 0; padding: 1.25rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .rep-header .brand { display: flex; align-items: center; gap: .75rem; }
    .rep-header h2 { font-size: 1.1rem; font-weight: 800; }
    .rep-header .meta { text-align: right; font-size: .8rem; color:var(--c-text-3); }
    .rep-header .meta strong { color:var(--c-muted); font-size: .9rem; }

    /* KPI strip */
    .kpi-strip { background: #1E293B; padding: 1rem 1.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .kpi { text-align: center; flex: 1; min-width: 100px; }
    .kpi-value { font-size: 1.8rem; font-weight: 900; color: #fff; line-height: 1; }
    .kpi-label { font-size: .7rem; font-weight: 600; color:var(--c-text-3); text-transform: uppercase; letter-spacing: .05em; margin-top: .2rem; }
    .kpi.green  .kpi-value { color: #4ADE80; }
    .kpi.yellow .kpi-value { color: #FCD34D; }
    .kpi.red    .kpi-value { color: #F87171; }
    .kpi.blue   .kpi-value { color: #60A5FA; }

    /* Summary table */
    .sum-table { width: 100%; border-collapse: collapse; background:var(--c-surface); font-size: .85rem; }
    .sum-table thead th { background:var(--c-surface-2); font-weight: 700; color:var(--c-text-2); text-align: left; padding: .7rem 1rem; border-bottom: 2px solid #E2E8F0; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
    .sum-table tbody td { padding: .7rem 1rem; border-bottom: 1px solid #F1F5F9; color:var(--c-text-2); vertical-align: top; }
    .sum-table tbody tr:last-child td { border-bottom: none; }
    .sum-table tbody tr:hover td { background: #FAFAFA; }
    .obra-name { font-weight: 700; color:var(--c-text); }
    .obra-sub  { font-size: .75rem; color:var(--c-muted); }
    .status-fin  { background:#DCFCE7;color:#166534;padding:.15rem .55rem;border-radius:9999px;font-size:.7rem;font-weight:700; }
    .status-rasc { background:#FEF3C7;color:#92400E;padding:.15rem .55rem;border-radius:9999px;font-size:.7rem;font-weight:700; }
    .status-pend { background:#DBEAFE;color:#1E40AF;padding:.15rem .55rem;border-radius:9999px;font-size:.7rem;font-weight:700; }
    .status-miss { background:#FEE2E2;color:#991B1B;padding:.15rem .55rem;border-radius:9999px;font-size:.7rem;font-weight:700; }
    .aprov-ok  { background:#DCFCE7;color:#166534;padding:.1rem .4rem;border-radius:9999px;font-size:.65rem;font-weight:700; }
    .aprov-res { background:#FEF3C7;color:#92400E;padding:.1rem .4rem;border-radius:9999px;font-size:.65rem;font-weight:700; }
    .aprov-pend{ color:var(--c-muted);font-size:.7rem;font-style:italic; }

    /* Desvios section */
    .desvios-section { background:var(--c-surface); }
    .desvio-item { padding: .75rem 1rem; border-bottom: 1px solid #F1F5F9; display: flex; gap: .75rem; align-items: flex-start; }
    .desvio-item:last-child { border-bottom: none; }
    .desvio-dot { width: 8px; height: 8px; background: #F97316; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .desvio-obra { font-size: .72rem; font-weight: 700; color:var(--c-text-3); text-transform: uppercase; letter-spacing: .04em; }
    .desvio-text { font-size: .85rem; color:var(--c-text-2); margin-top: .1rem; }
    .no-desvios  { padding: 1.5rem; text-align: center; color:var(--c-muted); font-size: .875rem; }

    /* Section title bar */
    .sec-title { background: #1E293B; color: #fff; padding: .6rem 1rem; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; justify-content: space-between; }
    .sec-title a { color: #F97316; font-size: .72rem; text-decoration: none; }

    /* Print footer */
    .rep-footer { background:var(--c-surface-2); border-top: 1px solid #E2E8F0; padding: .75rem 1.5rem; font-size: .75rem; color:var(--c-muted); display: flex; justify-content: space-between; border-radius: 0 0 .75rem .75rem; }

    /* Wrapper box */
    .rep-box { border: 1px solid #E2E8F0; border-radius: .75rem; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
  </style>
</head>
<body class="bg-slate-50">

      </a>
      <a href="obras.html" class="sidebar-nav-item">

        <span class="nav-label">Usuários</span>
      </a>
      <a href="historico.html" class="sidebar-nav-item">

      <a href="relatorio-executivo.html" class="sidebar-nav-item active">

    <div class="border-t border-slate-800 p-3">
      <div class="flex items-center gap-2.5 px-2">
        <div class="w-8 h-8 rounded-full bg-brand-500/20 flex items-center justify-center shrink-0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="nav-label flex-1 min-w-0">
          <p class="text-xs font-semibold text-white truncate" id="user-name">—</p>

        <button onclick="Auth.logout()" title="Sair" aria-label="Sair"

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>

  <!-- ── Main wrap ── -->
  <div id="admin-wrap" class="admin-main">

    <header class="admin-topbar">
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle" class="text-slate-500 hover:text-slate-800 transition-colors" style="background:none;border:none;cursor:pointer" aria-label="Alternar menu lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <h1 class="text-sm font-bold text-slate-900">Relatório Executivo</h1>
      </div>
      <div class="flex items-center gap-3">
        <label for="date-picker" class="text-xs text-slate-500 hidden sm:block">Referência:</label>
        <input type="date" id="date-picker" onchange="render()" aria-label="Data de referência do relatório"
               style="padding:.35rem .65rem;border:1.5px solid #CBD5E1;border-radius:.5rem;font-size:.875rem;color:var(--c-text)">
        <button class="btn btn-primary btn-sm" onclick="window.print()">Imprimir</button>
      </div>
    </header>

    <main id="conteudo" tabindex="-1" class="admin-content w-full">
      <div class="report" id="report">
        <div style="text-align:center;padding:3rem;color:var(--c-muted)">Carregando…</div>
      </div>
    </main>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    const picker = document.getElementById('date-picker');
    picker.value = Utils.today();

    DB.init().then(() => {
      const me = Auth.requireAuth('ADMIN');
      if (me) {
        document.getElementById('user-name').textContent = me.nome_completo;
        render();
      }
    });

    function render() {
      const data   = picker.value || Utils.today();
      const obras  = DB.getObras();
      const rdos   = DB.getRDOsByData(data);
      const ativas = DB.getObrasAtivas();

      const obrasComRDO = new Set(rdos.map(r => r.id_obra));
      const obrasSemRDO = ativas.filter(o => !obrasComRDO.has(o.id_obra));

      const fin  = rdos.filter(r => r.status_documento === 'Finalizado').length;
      const pend = rdos.filter(r => r.status_documento === 'Pendente_Assinatura').length;
      const rasc = rdos.filter(r => r.status_documento === 'Rascunho').length;
      const miss = obrasSemRDO.length;

      const totalEfetivo = rdos.reduce((s, r) => {
        const ef = r.efetivo || {};
        return s + Object.values(ef).reduce((a,v) => a+(+v||0), 0);
      }, 0);

      let totalLinhas = 0;
      rdos.forEach(r => { totalLinhas += DB.getRDOLinhas(r.id_rdo).length; });

      const desvios  = rdos.filter(r => r.observacoes_desvios && r.observacoes_desvios.trim().length > 0);
      const aprovados = rdos.filter(r => r.aprovacao_cliente === 'Aprovado').length;
      const ressalvas = rdos.filter(r => r.aprovacao_cliente === 'Aprovado com ressalvas').length;

      const html = `
        <div class="rep-box">
          <div class="rep-header">
            <div class="brand">
              <img src="../assets/img/logo.png" alt="Modular Service" width="3759" height="2115" style="height:28px;width:auto;border-radius:4px;">
              <div>
                <div style="font-size:.7rem;color:var(--c-text-3);font-weight:600">MODULAR SERVICE</div>
                <h2>Relatório Executivo de Obras</h2>
              </div>
            </div>
            <div class="meta">
              <strong>${Utils.getDayOfWeek(data)}, ${Utils.formatDate(data)}</strong><br>
              Gerado em ${new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}
            </div>
          </div>

          <div class="kpi-strip">
            <div class="kpi green"><div class="kpi-value">${fin}</div><div class="kpi-label">RDOs Finalizados</div></div>
            <div class="kpi blue"><div class="kpi-value">${pend}</div><div class="kpi-label">Pend. Assinatura</div></div>
            <div class="kpi yellow"><div class="kpi-value">${rasc}</div><div class="kpi-label">Em Rascunho</div></div>
            <div class="kpi red"><div class="kpi-value">${miss}</div><div class="kpi-label">Sem Apontamento</div></div>
            <div class="kpi blue"><div class="kpi-value">${totalEfetivo}</div><div class="kpi-label">Profissionais em campo</div></div>
            <div class="kpi green"><div class="kpi-value">${aprovados + ressalvas}</div><div class="kpi-label">Aprovados pelo cliente</div></div>
          </div>

          <div class="sec-title">
            <span>Resumo por Obra</span>
            <span>${ativas.length} obra(s) ativa(s)</span>
          </div>
          <table class="sum-table">
            <thead>
              <tr>
                <th>Obra / Cliente</th>
                <th>Atividade</th>
                <th>Equipe</th>
                <th>Período</th>
                <th>Clima</th>
                <th>Status RDO</th>
                <th>Aprovação Cliente</th>
                <th style="width:60px">Ação</th>
              </tr>
            </thead>
            <tbody>
              ${ativas.map(obra => {
                const rdo = rdos.find(r => r.id_obra === obra.id_obra);
                const ef  = rdo && rdo.efetivo ? Object.values(rdo.efetivo).reduce((s,v)=>s+(+v||0),0) : 0;
                if (!rdo) return `
                  <tr>
                    <td><div class="obra-name">${obra.nome_obra}</div><div class="obra-sub">${obra.cliente_nome} · OF: ${obra.codigo_of}</div></td>
                    <td colspan="6" style="color:var(--c-muted);font-style:italic">Sem apontamento no dia</td>
                    <td></td>
                  </tr>`;

                const statusTag = {
                  'Finalizado':          '<span class="status-fin">Finalizado</span>',
                  'Pendente_Assinatura': '<span class="status-pend">Pend. Assinatura</span>',
                  'Rascunho':            '<span class="status-rasc">Rascunho</span>',
                }[rdo.status_documento] || '';

                const aprovTag = !rdo.aprovacao_cliente
                  ? '<span class="aprov-pend">Aguardando</span>'
                  : rdo.aprovacao_cliente === 'Aprovado'
                    ? '<span class="aprov-ok">Aprovado</span>'
                    : '<span class="aprov-res">C/ressalvas</span>';

                const clima = [rdo.condicao_tempo_manha, rdo.condicao_tempo_tarde].filter(Boolean).join(' / ') || '—';

                return `<tr>
                  <td><div class="obra-name">${obra.nome_obra}</div><div class="obra-sub">${obra.cliente_nome} · OF: ${obra.codigo_of}</div></td>
                  <td style="max-width:160px;font-size:.8rem">${rdo.atividade||'—'}</td>
                  <td style="text-align:center;font-weight:700">${ef || '—'}</td>
                  <td style="font-size:.8rem;white-space:nowrap">${rdo.horario_inicio||'?'} – ${rdo.horario_termino||'?'}</td>
                  <td style="font-size:.78rem">${clima}</td>
                  <td>${statusTag}</td>
                  <td>${aprovTag}${rdo.comentario_cliente ? `<br><span style="font-size:.7rem;color:var(--c-text-3)">${rdo.comentario_cliente.slice(0,50)}${rdo.comentario_cliente.length>50?'…':''}</span>` : ''}</td>
                  <td style="text-align:center">
                    <a href="rdo-view.html?id=${rdo.id_rdo}" style="color:#F97316;font-size:.8rem;font-weight:700;text-decoration:none">Ver</a>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>

          <div class="sec-title"><span>Observações e Desvios do Dia</span><span>${desvios.length} registro(s)</span></div>
          <div class="desvios-section">
            ${desvios.length === 0
              ? '<div class="no-desvios">Nenhuma observação ou desvio registrado no dia.</div>'
              : desvios.map(r => {
                  const obra = DB.getObraById(r.id_obra) || {};
                  return `<div class="desvio-item">
                    <div class="desvio-dot"></div>
                    <div>
                      <div class="desvio-obra">${obra.nome_obra || '—'} — ${Utils.formatDate(r.data_apontamento)}</div>
                      <div class="desvio-text">${r.observacoes_desvios}</div>
                    </div>
                  </div>`;
                }).join('')
            }
          </div>

          ${ressalvas > 0 ? `
          <div class="sec-title"><span>Ressalvas de Clientes</span><span>${ressalvas} item(ns)</span></div>
          <div class="desvios-section">
            ${rdos.filter(r => r.aprovacao_cliente === 'Aprovado com ressalvas').map(r => {
              const obra = DB.getObraById(r.id_obra) || {};
              return `<div class="desvio-item">
                <div class="desvio-dot" style="background:#D97706"></div>
                <div>
                  <div class="desvio-obra">${obra.nome_obra} — ${r.nome_aprovador_cliente||''}</div>
                  <div class="desvio-text">${r.comentario_cliente||''}</div>
                </div>
              </div>`;
            }).join('')}
          </div>` : ''}

          <div class="rep-footer">
            <span>Modular Service — RDO Digital</span>
            <span>Referência: ${Utils.getDayOfWeek(data)}, ${Utils.formatDate(data)} · Total de obras ativas: ${ativas.length}</span>
          </div>
        </div>
      `;

      document.getElementById('report').innerHTML = html;
    }
  </script>
</body>
</html>
