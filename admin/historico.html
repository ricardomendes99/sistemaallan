  <!-- ── Sidebar ── -->

    <div class="flex justify-center py-4 border-b border-slate-800">
      <img id="logo-full" src="../assets/img/logo.png" alt="Modular" width="3759" height="2115" class="h-14 w-auto rounded-xl">
      <img id="logo-icon" src="../assets/img/M%20logo.png" alt="M" width="3759" height="2115" class="h-14 w-14 rounded-xl object-contain" style="display:none">
    </div>
    <nav class="flex-1 py-3 overflow-y-auto">
      <a href="dashboard.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="obras.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Obras</span>
      </a>
      <a href="usuarios.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">Usuários</span>
      </a>
      <a href="historico.html" class="sidebar-nav-item active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="nav-label">Histórico RDOs</span>
      </a>
      <a href="relatorio-executivo.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="nav-label">Relatório Executivo</span>
      </a>
      <a href="backup.html" class="sidebar-nav-item">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 7 20 21 4 21 4 7"/><rect x="1" y="3" width="22" height="4"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        <span class="nav-label">Backup</span>
      </a>
    </nav>
    <div class="border-t border-slate-800 p-3">
      <div class="flex items-center gap-2.5 px-2">
        <div class="w-8 h-8 rounded-full bg-brand-500/20 flex items-center justify-center shrink-0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="nav-label flex-1 min-w-0">
          <p class="text-xs font-semibold text-white truncate" id="user-name">—</p>
          <p class="text-xs text-slate-500">Administrador</p>
        </div>
        <button onclick="Auth.logout()" title="Sair" aria-label="Sair"
                class="nav-label text-slate-500 hover:text-red-400 transition-colors p-1"
                style="background:none;border:none;cursor:pointer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Main wrap ── -->
  <div id="admin-wrap" class="admin-main">

    <header class="admin-topbar">
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle" class="text-slate-500 hover:text-slate-800 transition-colors" style="background:none;border:none;cursor:pointer" aria-label="Alternar menu lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <h1 class="text-sm font-bold text-slate-900">Histórico de RDOs</h1>
      </div>
    </header>

    <main id="conteudo" tabindex="-1" class="admin-content w-full">

      <!-- Filters card -->
      <div class="card mb-5">
        <div class="card-header flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros
        </div>
        <div class="filters p-4 flex gap-3 flex-wrap">
          <select id="f-obra" onchange="render()" aria-label="Filtrar por obra"
            class="px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-800 bg-white focus:outline-none focus:border-brand-500 dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100">
            <option value="">Todas as obras</option>
          </select>
          <select id="f-status" onchange="render()" aria-label="Filtrar por status"
            class="px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-800 bg-white focus:outline-none focus:border-brand-500 dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100">
            <option value="">Todos os status</option>
            <option value="Rascunho">Rascunho</option>
            <option value="Pendente_Assinatura">Pendente Assinatura</option>
            <option value="Finalizado">Finalizado</option>
          </select>
          <input type="date" id="f-data-ini" onchange="render()" aria-label="Data inicial"
            class="px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-800 bg-white focus:outline-none focus:border-brand-500 dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100">
          <input type="date" id="f-data-fim" onchange="render()" aria-label="Data final"
            class="px-3 py-2 border border-slate-200 rounded-lg text-sm text-slate-800 bg-white focus:outline-none focus:border-brand-500 dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100">
          <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Limpar filtros</button>
        </div>
      </div>

      <!-- Table card -->
      <div class="card overflow-x-auto">
        <div class="card-header flex items-center justify-between">
          <span>RDOs Registrados</span>
          <span id="result-count" class="text-xs text-slate-400 font-normal"></span>
        </div>
        <table class="tbl">
          <thead>
            <tr><th>Obra</th><th>Data</th><th>Dia</th><th>Criador</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </main>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    DB.init().then(() => {
      const me = Auth.requireAuth('ADMIN');
      if (me) {
        document.getElementById('user-name').textContent = me.nome_completo;
        const sel = document.getElementById('f-obra');
        DB.getObras().forEach(o => { const opt = document.createElement('option'); opt.value = o.id_obra; opt.textContent = o.nome_obra; sel.appendChild(opt); });
        render();
      }
    });

    function render() {
      let rdos = [...DB.getRDOs()].reverse();
      const fObra = document.getElementById('f-obra').value;
      const fSt   = document.getElementById('f-status').value;
      const fDe   = document.getElementById('f-data-ini').value;
      const fAte  = document.getElementById('f-data-fim').value;
      if (fObra) rdos = rdos.filter(r => r.id_obra === fObra);
      if (fSt)   rdos = rdos.filter(r => r.status_documento === fSt);
      if (fDe)   rdos = rdos.filter(r => r.data_apontamento >= fDe);
      if (fAte)  rdos = rdos.filter(r => r.data_apontamento <= fAte);

      document.getElementById('result-count').textContent = `${rdos.length} RDO(s) encontrado(s)`;
      const tbody = document.getElementById('tbody');
      if (rdos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2.5rem;color:var(--c-muted)">Nenhum RDO encontrado.</td></tr>';
        return;
      }
      tbody.innerHTML = rdos.map(r => {
        const obra = DB.getObraById(r.id_obra);
        const cri  = DB.getUserById(r.id_usuario_criador);
        return `<tr>
          <td class="font-semibold">${obra ? obra.nome_obra : '—'}</td>
          <td>${Utils.formatDate(r.data_apontamento)}</td>
          <td class="text-slate-500 text-sm">${Utils.getDayOfWeek(r.data_apontamento)}</td>
          <td>${cri ? cri.nome_completo : '—'}</td>
          <td>${Utils.statusBadge(r.status_documento)}</td>
          <td><a href="rdo-view.html?id=${r.id_rdo}" class="text-sm font-semibold text-brand-500 hover:text-brand-600 transition-colors">Ver →</a></td>
        </tr>`;
      }).join('');
    }

    function clearFilters() {
      ['f-obra','f-status','f-data-ini','f-data-fim'].forEach(id => document.getElementById(id).value = '');
      render();
    }
  </script>
</body>
</html>
