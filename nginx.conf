events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;

  server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|pdf)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.(css|js)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location = /assets/js/config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Assinafy API proxy — API key injected server-side, nunca exposta ao browser
    location /assinafy-proxy/ {
      include /etc/nginx/snippets/assinafy_key.conf;
      proxy_pass https://api.assinafy.com.br/v1/;
      proxy_set_header Host api.assinafy.com.br;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 15s;
      proxy_read_timeout 60s;
      client_max_body_size 30m;
    }
  }
}
