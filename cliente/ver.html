<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="/faviconemodular/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/faviconemodular/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/faviconemodular/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/faviconemodular/apple-icon-180x180.png">
  <link rel="manifest" href="/faviconemodular/manifest.json">
  <meta name="msapplication-config" content="/faviconemodular/browserconfig.xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprovação de RDO — Modular Service</title>
  <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="bg-slate-100 min-h-screen dark:bg-slate-950">

  <!-- ── Header ── -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10 dark:bg-slate-900 dark:border-slate-800">
    <img src="../assets/img/logo.png" class="h-8 rounded-lg" alt="Modular Service">
    <span class="text-xs text-slate-500 font-medium">Portal de Aprovação</span>
  </header>

  <!-- ── Main ── -->
  <main id="main-content">
    <div class="text-center py-12 text-slate-400">Verificando acesso…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rdoId  = params.get('rdo');
    const token  = params.get('t');
    let _codigoEsperado = '';

    DB.init().then(() => {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !token) { showError('Link inválido ou expirado.'); return; }
      if (rdo.cliente_token !== token) { showError('Código de acesso inválido.'); return; }
      const obra = DB.getObraById(rdo.id_obra);
      if (obra && obra.codigo_cliente) {
        showCodigoGate(obra);
      } else {
        load();
      }
    });

    /* ── Tela 1: Gate de código ── */
    function showCodigoGate(obra) {
      _codigoEsperado = obra.codigo_cliente;
      document.getElementById('main-content').innerHTML = `
        <div class="max-w-sm mx-auto mt-12 p-4">
          <div class="card p-6">
            <h2 class="text-xl font-bold text-slate-900 mb-1 dark:text-slate-100">Verificação de Identidade</h2>
            <p class="text-sm text-slate-500 mb-6">Para acessar o RDO da obra <strong>${obra.nome_obra}</strong>, informe o código de verificação que você recebeu.</p>
            <div class="field mb-4">
              <label>Código de acesso</label>
              <input type="text" id="f-codigo-cli" placeholder="Ex: A3F7K2"
                class="text-center text-2xl font-bold tracking-[.5rem] uppercase"
                maxlength="6"
                oninput="this.value=this.value.toUpperCase()"
                onkeydown="if(event.key==='Enter')verificarCodigo()">
            </div>
            <div id="codigo-err" class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm flex items-center gap-2 mb-4" style="display:none!important">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Código incorreto. Verifique com a Modular Service.
            </div>
            <button onclick="verificarCodigo()" class="btn btn-primary btn-full">Verificar</button>
          </div>
        </div>`;
    }

    function verificarCodigo() {
      const digitado = (document.getElementById('f-codigo-cli').value || '').trim().toUpperCase();
      const errEl = document.getElementById('codigo-err');
      if (digitado === _codigoEsperado.toUpperCase()) {
        load();
      } else {
        errEl.style.removeProperty('display');
        errEl.style.display = 'flex';
      }
    }

    /* ── Tela 2: RDO + Aprovação ── */
    function load() {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !token) { showError('Link inválido ou expirado.'); return; }
      if (rdo.cliente_token !== token) { showError('Código de acesso inválido.'); return; }

      // Already approved
      if (rdo.aprovacao_cliente) { showAlreadyApproved(rdo); return; }

      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      const ef     = rdo.efetivo || {};
      const total  = Object.values(ef).reduce((s,v) => s+(+v||0), 0);

      const statusPillClass = {
        'Iniciada':      'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300',
        'Em Andamento':  'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300',
        'Concluída':     'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300'
      };

      document.getElementById('main-content').innerHTML = `
        <div class="max-w-5xl mx-auto px-4 py-4">

          <!-- Título -->
          <div class="mb-4">
            <p class="text-lg font-bold text-slate-900 dark:text-slate-100">${obra.nome_obra || '—'}</p>
            <p class="text-sm text-slate-500">${Utils.getDayOfWeek(rdo.data_apontamento)}, ${Utils.formatDate(rdo.data_apontamento)}</p>
          </div>

          <!-- Dados gerais -->
          <div class="card p-5 mb-4">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Dados do Relatório</p>
            <div class="divide-y divide-slate-100 dark:divide-slate-700/60">
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Cliente</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${obra.cliente_nome||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Local</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${obra.endereco_local||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Atividade</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${rdo.atividade||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Período</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${rdo.horario_inicio||'—'} — ${rdo.horario_termino||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Tempo Manhã</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${rdo.condicao_tempo_manha||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Tempo Tarde</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${rdo.condicao_tempo_tarde||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Equipe total</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${total} profissional(is)</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">Executante</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${cri.nome_completo||'—'}</span></div>
              <div class="flex justify-between items-start py-2 text-sm"><span class="text-slate-500">OF</span><span class="font-semibold text-slate-800 text-right max-w-[60%] dark:text-slate-200">${obra.codigo_of||'—'}</span></div>
            </div>
          </div>

          <!-- Atividades hora a hora -->
          <div class="card p-5 mb-4">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Atividades Realizadas</p>
            <div class="divide-y divide-slate-50 dark:divide-slate-700/30">
              ${Utils.getSlots().map(slot => {
                const l = linhas.find(x => x.horario_ponto === slot);
                if (slot === rdo.horario_almoco)
                  return `<div class="flex gap-3 py-2.5 items-start">
                    <span class="text-sm font-extrabold text-amber-600 min-w-[50px] shrink-0">${slot}</span>
                    <em class="text-sm text-amber-800 dark:text-amber-300">Intervalo de almoço</em>
                  </div>`;
                if (!l || !l.descricao_detalhada)
                  return `<div class="flex gap-3 py-2.5 items-start opacity-35">
                    <span class="text-sm font-extrabold text-slate-800 min-w-[50px] shrink-0 dark:text-slate-100">${slot}</span>
                    <span class="text-sm text-slate-500">—</span>
                  </div>`;
                const pillClass = statusPillClass[l.status_atividade] || '';
                return `<div class="flex gap-3 py-2.5 items-start">
                  <span class="text-sm font-extrabold text-slate-800 min-w-[50px] shrink-0 dark:text-slate-100">${slot}</span>
                  <div class="flex-1 text-sm text-slate-700 leading-relaxed dark:text-slate-300">
                    ${l.referencia_modulo ? `<span class="text-xs text-slate-400 font-semibold">${l.referencia_modulo}</span><br>` : ''}
                    ${l.descricao_detalhada}
                  </div>
                  ${l.status_atividade ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full shrink-0 ${pillClass}">${l.status_atividade}</span>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>

          ${rdo.observacoes_desvios ? `
          <div class="card p-5 mb-4">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Observações e Desvios</p>
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm text-amber-900 whitespace-pre-wrap dark:bg-amber-900/20 dark:border-amber-700 dark:text-amber-200">${rdo.observacoes_desvios}</div>
          </div>` : ''}

          ${rdo.fotos && rdo.fotos.length > 0 ? `
          <div class="card p-5 mb-4">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Fotos da Obra (${rdo.fotos.length})</p>
            <div class="grid gap-2.5" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">
              ${rdo.fotos.map((src, i) => `
                <div class="aspect-square rounded-lg overflow-hidden border border-slate-200 cursor-zoom-in dark:border-slate-700" onclick="verFoto('${i}')">
                  <img src="${src}" alt="Foto ${i+1}" class="w-full h-full object-cover block">
                </div>`).join('')}
            </div>
          </div>` : ''}

          <!-- Aprovação do cliente -->
          <div class="card p-5 mt-6">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Sua Aprovação</p>
            <p class="text-sm text-slate-600 mb-4">Revise o relatório acima e registre sua aprovação:</p>

            <!-- Opções -->
            <div class="flex flex-col gap-2 mb-4" id="aprov-opts">
              <label class="flex items-center gap-3 p-4 rounded-xl border-2 border-slate-200 cursor-pointer transition-all hover:border-emerald-400 dark:border-slate-600 dark:hover:border-emerald-500" onclick="selectAprov(this)">
                <input type="radio" name="aprov" value="Aprovado" class="w-5 h-5 accent-emerald-600 cursor-pointer shrink-0">
                <div>
                  <p class="text-sm font-semibold text-slate-800 flex items-center gap-1.5 dark:text-slate-100">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    Aprovado
                  </p>
                  <p class="text-xs text-slate-500 mt-0.5">Confirmo as atividades realizadas conforme descrito.</p>
                </div>
              </label>

              <label class="flex items-center gap-3 p-4 rounded-xl border-2 border-slate-200 cursor-pointer transition-all hover:border-amber-400 dark:border-slate-600 dark:hover:border-amber-500" onclick="selectAprov(this,'ressalvas')">
                <input type="radio" name="aprov" value="Aprovado com ressalvas" class="w-5 h-5 accent-amber-500 cursor-pointer shrink-0">
                <div>
                  <p class="text-sm font-semibold text-slate-800 flex items-center gap-1.5 dark:text-slate-100">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    Aprovado com ressalvas
                  </p>
                  <p class="text-xs text-slate-500 mt-0.5">Aprovo com comentários adicionais abaixo.</p>
                </div>
              </label>
            </div>

            <!-- Comentário -->
            <div class="field mb-4">
              <label>Comentário (opcional)</label>
              <textarea id="f-coment" placeholder="Escreva aqui qualquer observação ou ressalva…"
                class="w-full border-slate-300 rounded-xl p-3 text-sm resize-y min-h-[90px] focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/10 transition-all dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100 dark:focus:border-brand-500"></textarea>
            </div>

            <!-- Nome -->
            <div class="field mb-5">
              <label>Seu nome *</label>
              <input type="text" id="f-nome-cli" placeholder="Nome completo do responsável" autocomplete="name">
            </div>

            <button class="btn btn-primary btn-full" onclick="confirmarAprovacao()">Confirmar Aprovação</button>
          </div>

        </div>
      `;
    }

    function verFoto(idx) {
      const rdo = DB.getRDOById(rdoId);
      if (!rdo || !rdo.fotos) return;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out';
      overlay.innerHTML = `<img src="${rdo.fotos[idx]}" style="max-width:100%;max-height:100%;border-radius:.5rem;object-fit:contain">`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    }

    function selectAprov(el, tipo) {
      const isDark = document.documentElement.classList.contains('dark');
      document.querySelectorAll('#aprov-opts label').forEach(x => {
        x.classList.remove('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-900/20',
                           'border-amber-500', 'bg-amber-50', 'dark:bg-amber-900/20');
        x.classList.add('border-slate-200', 'dark:border-slate-600');
      });
      el.classList.remove('border-slate-200', 'dark:border-slate-600');
      if (tipo === 'ressalvas') {
        el.classList.add('border-amber-500', 'bg-amber-50', 'dark:bg-amber-900/20');
      } else {
        el.classList.add('border-emerald-500', 'bg-emerald-50', 'dark:bg-emerald-900/20');
      }
    }

    function confirmarAprovacao() {
      const aprov = document.querySelector('input[name="aprov"]:checked');
      const nome  = document.getElementById('f-nome-cli').value.trim();
      const comt  = document.getElementById('f-coment').value.trim();
      if (!aprov) { Toast.error('Selecione uma opção de aprovação.'); return; }
      if (!nome)  { Toast.error('Informe seu nome.'); return; }

      DB.updateRDO(rdoId, {
        aprovacao_cliente:            aprov.value,
        comentario_cliente:           comt,
        nome_aprovador_cliente:       nome,
        data_aprovacao_cliente:       new Date().toISOString()
      });

      /* ── Tela 3: Sucesso ── */
      document.getElementById('main-content').innerHTML = `
        <div class="min-h-[60vh] flex flex-col items-center justify-center text-center p-6">
          <div class="w-20 h-20 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-6">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-900 mb-1 dark:text-slate-100">Aprovação registrada!</h2>
          <p class="text-slate-500 text-sm mb-1"><strong>${nome}</strong></p>
          <p class="text-slate-500 text-sm mb-6">${aprov.value}</p>
          ${comt ? `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-700 text-left max-w-sm w-full mb-6 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200">"${comt}"</div>` : ''}
          <p class="text-xs text-slate-400">Obrigado! Este registro foi enviado para a equipe Modular Service.</p>
        </div>`;
    }

    function showAlreadyApproved(rdo) {
      const isOk = rdo.aprovacao_cliente === 'Aprovado';
      document.getElementById('main-content').innerHTML = `
        <div class="min-h-[60vh] flex flex-col items-center justify-center text-center p-6">
          <div class="w-20 h-20 rounded-full ${isOk ? 'bg-emerald-100' : 'bg-amber-100'} flex items-center justify-center mx-auto mb-6">
            ${isOk
              ? `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
              : `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
            }
          </div>
          <h2 class="text-2xl font-bold text-slate-900 mb-2 dark:text-slate-100">RDO já aprovado</h2>
          <p class="text-slate-600 font-semibold mb-2 dark:text-slate-300">${rdo.nome_aprovador_cliente}</p>
          <span class="${isOk ? 'aprov-ok' : 'aprov-ressalvas'} mb-4">${rdo.aprovacao_cliente}</span>
          ${rdo.comentario_cliente ? `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-700 text-left max-w-sm w-full mb-4 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200">"${rdo.comentario_cliente}"</div>` : ''}
          <p class="text-xs text-slate-400">Aprovado em ${Utils.formatDate(rdo.data_aprovacao_cliente ? rdo.data_aprovacao_cliente.split('T')[0] : '')}</p>
        </div>`;
    }

    function showError(msg) {
      document.getElementById('main-content').innerHTML = `
        <div class="max-w-sm mx-auto mt-12 p-4">
          <div class="bg-red-50 border border-red-200 text-red-800 rounded-2xl p-6 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-3">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <p class="font-bold text-base mb-1">Acesso negado</p>
            <p class="text-sm text-red-700">${msg}</p>
          </div>
        </div>`;
    }

  </script>
</body>
</html>
