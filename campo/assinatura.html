<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="/faviconemodular/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/faviconemodular/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/faviconemodular/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/faviconemodular/apple-icon-180x180.png">
  <link rel="manifest" href="/faviconemodular/manifest.json">
  <meta name="msapplication-config" content="/faviconemodular/browserconfig.xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura do Cliente — RDO Digital</title>
  <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="bg-slate-50 min-h-screen pb-8">

  <!-- ── Top bar ── -->
  <header class="bg-white border-b border-slate-200 px-4 h-16 flex items-center justify-between sticky top-0 z-10">
    <button onclick="history.back()" class="btn btn-ghost btn-sm" style="cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </button>
    <span class="text-slate-900 text-sm font-semibold">Finalizar RDO</span>
    <div class="w-16"></div>
  </header>

  <!-- ── Main content ── -->
  <main class="max-w-lg mx-auto p-4 pb-8" id="main-content">
    <div class="text-center py-12 text-slate-400">Carregando…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../assets/js/pdf-gen.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const rdoId  = params.get('rdo');
    let sigPad = null;
    let isEmpty = true;
    let me = null;

    DB.init().then(() => {
      me = Auth.requireAuth('USUARIO');
      if (me && rdoId) load();
    });

    function load() {
      const rdo  = DB.getRDOById(rdoId);
      if (!rdo)  {
        document.getElementById('main-content').innerHTML = '<p class="p-8 text-red-500">RDO não encontrado.</p>';
        return;
      }

      if (rdo.status_documento === 'Finalizado') {
        showFinalized(rdo);
        return;
      }

      const obra   = DB.getObraById(rdo.id_obra) || {};
      const linhas = DB.getRDOLinhas(rdoId);
      const ef     = rdo.efetivo || {};
      const total  = Object.values(ef).reduce((s,v) => s+(+v||0), 0);

      document.getElementById('main-content').innerHTML = `
        <!-- Resumo do RDO -->
        <div class="card p-4 mb-5">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Resumo do RDO</p>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Obra</p>
              <p class="text-sm font-semibold text-slate-800">${obra.nome_obra || '—'}</p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Cliente</p>
              <p class="text-sm font-semibold text-slate-800">${obra.cliente_nome || '—'}</p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Data</p>
              <p class="text-sm font-semibold text-slate-800">${Utils.getDayOfWeek(rdo.data_apontamento)}, ${Utils.formatDate(rdo.data_apontamento)}</p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Período</p>
              <p class="text-sm font-semibold text-slate-800">${rdo.horario_inicio || '—'} às ${rdo.horario_termino || '—'}</p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Profissionais</p>
              <p class="text-sm font-semibold text-slate-800">${total}</p>
            </div>
            <div>
              <p class="text-xs text-slate-500 uppercase tracking-wide">Horas preenchidas</p>
              <p class="text-sm font-semibold text-slate-800">${linhas.length} registros</p>
            </div>
          </div>
        </div>

        <!-- Nome do responsável -->
        <div class="field mb-5">
          <label>Nome do Responsável pela Assinatura *</label>
          <input type="text" id="f-nome-cliente" placeholder="Nome completo do cliente/responsável" autocomplete="name">
        </div>

        <!-- Assinatura -->
        <div class="mb-5">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Assinatura do Cliente</p>
          <p class="text-xs text-slate-400 mb-2">Assine no espaço abaixo usando o dedo ou caneta touch:</p>
          <div class="sig-wrap">
            <canvas id="sig-canvas" style="display:block;width:100%;height:220px;touch-action:none;cursor:crosshair;border-radius:.5rem;border:2px dashed #CBD5E1;background:#fff;"></canvas>
          </div>
          <p id="sig-status" class="text-xs text-center mt-2 transition-colors text-slate-400">Aguardando assinatura…</p>
          <button class="btn btn-ghost btn-sm w-full mt-2" onclick="clearSig()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Limpar assinatura
          </button>
        </div>

        <!-- Botão finalizar -->
        <button class="btn btn-primary btn-full mt-4" id="btn-finalizar" onclick="finalizar()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Finalizar RDO
        </button>
      `;

      initSigPad();
    }

    function initSigPad() {
      const canvas = document.getElementById('sig-canvas');
      const ctx    = canvas.getContext('2d');
      const dpr    = window.devicePixelRatio || 1;

      // Set canvas resolution
      const rect = canvas.getBoundingClientRect();
      canvas.width  = rect.width  * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth   = 2.2;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';

      let drawing = false;
      let lastX = 0, lastY = 0;

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const src = e.touches ? e.touches[0] : e;
        return { x: src.clientX - r.left, y: src.clientY - r.top };
      }

      function start(e) {
        e.preventDefault();
        drawing = true;
        const p = getPos(e);
        lastX = p.x; lastY = p.y;
        ctx.beginPath(); ctx.moveTo(lastX, lastY);
      }
      function move(e) {
        e.preventDefault();
        if (!drawing) return;
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x; lastY = p.y;
        if (!isEmpty) return;
        isEmpty = false;
        canvas.classList.add('has-sig');
        document.getElementById('sig-status').textContent = 'Assinatura capturada ✓';
        document.getElementById('sig-status').style.color = '#16A34A';
      }
      function stop(e) { e.preventDefault(); drawing = false; ctx.beginPath(); }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove',  move,  { passive: false });
      canvas.addEventListener('touchend',   stop,  { passive: false });
    }

    function clearSig() {
      const canvas = document.getElementById('sig-canvas');
      const ctx    = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.classList.remove('has-sig');
      isEmpty = true;
      const status = document.getElementById('sig-status');
      status.textContent = 'Aguardando assinatura…';
      status.style.color = '';
    }

    function finalizar() {
      const nome = (document.getElementById('f-nome-cliente')?.value || '').trim();
      if (!nome) { Utils.toast('Informe o nome do responsável.', 'error'); return; }
      if (isEmpty) { Utils.toast('Colete a assinatura do cliente antes de finalizar.', 'error'); return; }

      const canvas = document.getElementById('sig-canvas');
      const sigB64 = canvas.toDataURL('image/png');

      DB.updateRDO(rdoId, {
        status_documento:          'Finalizado',
        assinatura_cliente_base64: sigB64,
        assinatura_nome_confirmacao: nome,
        data_fechamento:           new Date().toISOString()
      });

      Utils.toast('RDO finalizado com sucesso!', 'success');
      setTimeout(() => {
        // Auto-generate PDF
        try {
          const rdo    = DB.getRDOById(rdoId);
          const obra   = DB.getObraById(rdo.id_obra) || {};
          const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
          const linhas = DB.getRDOLinhas(rdoId);
          PDFGen.generate(rdo, obra, cri, linhas);
        } catch(e) { console.warn('PDF gen error:', e); }
        showFinalized(DB.getRDOById(rdoId));
      }, 500);
    }

    function showFinalized(rdo) {
      document.getElementById('main-content').innerHTML = `
        <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-white -mx-4 -mt-4">
          <div class="w-20 h-20 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-6">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 class="text-2xl font-bold text-slate-900 mb-2">RDO Finalizado!</h2>
          <p class="text-slate-500 mb-8">O relatório foi assinado e gerado com sucesso.<br>O PDF foi baixado automaticamente.</p>
          <div class="grid grid-cols-2 gap-3 w-full max-w-xs">
            <button class="btn btn-primary" onclick="downloadPDF('${rdo.id_rdo}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Baixar PDF
            </button>
            <button class="btn btn-ghost" onclick="location.href='home.html'">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              Voltar
            </button>
          </div>
        </div>`;
    }

    function downloadPDF(id) {
      const rdo    = DB.getRDOById(id || rdoId);
      const obra   = DB.getObraById(rdo.id_obra) || {};
      const cri    = DB.getUserById(rdo.id_usuario_criador) || {};
      const linhas = DB.getRDOLinhas(id || rdoId);
      PDFGen.generate(rdo, obra, cri, linhas);
    }
  </script>
</body>
</html>
