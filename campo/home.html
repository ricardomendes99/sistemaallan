<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="/faviconemodular/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/faviconemodular/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/faviconemodular/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/faviconemodular/apple-icon-180x180.png">
  <link rel="manifest" href="/faviconemodular/manifest.json">
  <meta name="msapplication-config" content="/faviconemodular/browserconfig.xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecionar Obra — RDO Digital</title>
  <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- ── Top bar ── -->
  <header class="h-14 bg-white border-b border-slate-200 flex items-center gap-3 px-4 sticky top-0 z-10">
    <img src="../assets/img/logo.png" alt="Modular" class="h-10 shrink-0" style="width:auto">
    <span class="text-slate-900 font-bold text-sm">RDO Digital</span>
  </header>

  <!-- ── Main ── -->
  <main class="px-4 pt-6 pb-24 max-w-lg mx-auto">

    <!-- Greeting -->
    <div class="mb-6">
      <p class="text-lg font-bold text-slate-900" id="greeting"></p>
      <p class="text-sm text-slate-500 mt-0.5" id="date-str"></p>
    </div>

    <!-- Section title -->
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Selecione a obra do dia</p>

    <!-- Obras list -->
    <div id="obras-list"></div>

  </main>

  <!-- Modal: Plantas -->
  <div class="modal-overlay" id="modal-plantas" style="display:none" onclick="if(event.target===this)fecharPlantas()">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <p class="font-bold text-base text-slate-800" id="plantas-obra-nome">Plantas e Anexos</p>
          <p class="text-xs text-slate-500 mt-0.5">Arquivos desta obra</p>
        </div>
        <button onclick="fecharPlantas()" aria-label="Fechar"
                class="text-slate-400 hover:text-slate-600 transition-colors cursor-pointer w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100"
                style="background:none;border:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body p-0" id="plantas-lista" style="min-height:80px"></div>
    </div>
  </div>

  <!-- ── User bar (rodapé, igual sidebar admin) ── -->
  <div class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 z-10">
    <div class="flex items-center gap-2.5 px-3 py-3">
      <div class="w-8 h-8 rounded-full bg-brand-500/20 flex items-center justify-center shrink-0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="min-w-0">
        <p class="text-xs font-semibold text-white truncate" id="user-display">—</p>
        <p class="text-xs text-slate-500">Campo</p>
      </div>
      <button onclick="Auth.logout()" title="Sair"
              class="text-slate-500 hover:text-red-400 transition-colors p-1"
              style="background:none;border:none;cursor:pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/db.js?v=3"></script>
  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/utils.js?v=3"></script>
  <script src="../assets/js/ui.js"></script>
  <script>
    let me = null;
    DB.init().then(() => {
      me = Auth.requireAuth('USUARIO');
      if (me) render();
    });

    function render() {
      const hora = new Date().getHours();
      const greet = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
      document.getElementById('greeting').textContent = `${greet}, ${me.nome_completo.split(' ')[0]}!`;

      const hoje = Utils.today();
      document.getElementById('date-str').textContent = Utils.getDayOfWeek(hoje) + ', ' + Utils.formatDate(hoje);
      document.getElementById('user-display').textContent = me.nome_completo.split(' ')[0];

      const obras = DB.getObrasByUsuario(me.id);
      const container = document.getElementById('obras-list');

      if (obras.length === 0) {
        container.innerHTML = `
          <div class="card p-10 text-center">
            <div class="w-14 h-14 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto mb-3">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <p class="font-semibold text-slate-600 text-sm">Nenhuma obra atribuída</p>
            <p class="text-xs text-slate-400 mt-1">Aguarde o administrador vincular você a uma obra.</p>
          </div>`;
        return;
      }

      container.innerHTML = obras.map(o => {
        const rdo = DB.getRDOByObraDataUsuario(o.id_obra, Utils.today(), me.id);
        let tagHtml = '';
        if (!rdo) {
          tagHtml = `<span class="tag-pending gap-1">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Iniciar RDO</span>`;
        } else if (rdo.status_documento === 'Finalizado') {
          tagHtml = `<span class="tag-ok gap-1">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Finalizado</span>`;
        } else if (rdo.status_documento === 'Pendente_Assinatura') {
          tagHtml = `<span class="tag-info gap-1">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Assinar</span>`;
        } else {
          tagHtml = `<span class="tag-pending gap-1">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Rascunho</span>`;
        }

        const nAnexos = DB.getAnexosByObra(o.id_obra).length;
        return `<div class="card p-4 mb-3 cursor-pointer active:scale-[.99] transition-all hover:border-brand-500 hover:shadow-card-hover"
                     onclick="selectObra('${o.id_obra}')">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <p class="font-bold text-slate-800 text-base leading-snug truncate">${o.nome_obra}</p>
              <p class="text-sm text-slate-500 mt-0.5 truncate">${o.cliente_nome}</p>
              <p class="text-xs text-slate-400 mt-0.5">${o.endereco_local || 'Local não informado'} · OF: ${o.codigo_of}</p>
              ${nAnexos > 0 ? `
              <button onclick="event.stopPropagation();verPlantas('${o.id_obra}')"
                      class="mt-2 inline-flex items-center gap-1.5 bg-blue-50 text-blue-600 rounded-full px-2.5 py-1 text-xs font-bold cursor-pointer transition-colors hover:bg-blue-100"
                      style="border:none;">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                ${nAnexos} planta${nAnexos > 1 ? 's' : ''}
              </button>` : ''}
            </div>
            <div class="shrink-0 mt-0.5">${tagHtml}</div>
          </div>
        </div>`;
      }).join('');
    }

    function selectObra(obraId) {
      location.href = `rdo.html?obra=${obraId}`;
    }

    function verPlantas(obraId) {
      const obra = DB.getObraById(obraId);
      document.getElementById('plantas-obra-nome').textContent = obra ? obra.nome_obra : 'Obra';
      const anexos = DB.getAnexosByObra(obraId);
      const el = document.getElementById('plantas-lista');
      if (anexos.length === 0) {
        el.innerHTML = '<p class="text-center text-sm text-slate-400 py-5 px-4">Nenhum arquivo disponível.</p>';
      } else {
        el.innerHTML = anexos.map(a => `
          <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 last:border-0">
            <div class="flex-1 min-w-0 mr-3">
              <p class="font-bold text-sm text-slate-800 truncate">${a.nome}</p>
              <p class="text-xs text-slate-400 mt-0.5 truncate">${a.arquivo_nome}</p>
            </div>
            <a href="${a.arquivo_url}" target="_blank" download="${a.arquivo_nome}"
               class="btn btn-primary btn-sm whitespace-nowrap"
               style="text-decoration:none">
              Abrir / Baixar
            </a>
          </div>`).join('');
      }
      document.getElementById('modal-plantas').style.display = 'flex';
    }

    function fecharPlantas() { document.getElementById('modal-plantas').style.display = 'none'; }
  </script>
</body>
</html>
