version: '3.8'

services:
  modular-rdo:
    build:
      context: .
      dockerfile: Dockerfile
    image: modular-rdo:latest
    container_name: modular-rdo
    restart: unless-stopped

    environment:
      - TZ=America/Sao_Paulo
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://supabase.b2btaxipremium.com.br}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.modularrdo.rule=Host(`${DOMAIN_NAME:-modularservicerdo.autotech.dev.br}`)"
      - "traefik.http.routers.modularrdo.entrypoints=websecure"
      - "traefik.http.routers.modularrdo.tls=true"
      - "traefik.http.routers.modularrdo.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.modularrdo.loadbalancer.server.port=80"
      - "traefik.docker.network=network_public"

    networks:
      - network_public

networks:
  network_public:
    external: true
    name: network_public
