version: '3.8'

services:
  modular-rdo:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistemaallan:latest

    environment:
      - TZ=America/Sao_Paulo
      - VITE_SUPABASE_URL=https://supabase.b2btaxipremium.com.br
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3MiOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAogICJleHAiOiAxODcyODE3MjAwCn0.R6vNyomYgFqgngQhxOMSRCrlpGkIkELQDuxNnu1kSOY

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.modularrdo.rule=Host(`modularservicerdo.autotech.dev.br`)"
      - "traefik.http.routers.modularrdo.entrypoints=websecure"
      - "traefik.http.routers.modularrdo.tls=true"
      - "traefik.http.routers.modularrdo.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.modularrdo.loadbalancer.server.port=80"
      - "traefik.docker.network=network_public"

    networks:
      - network_public

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  network_public:
    external: true
    name: network_public
